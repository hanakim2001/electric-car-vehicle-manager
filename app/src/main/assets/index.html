<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>전기차 차량 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#17222b;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',Arial,sans-serif}header{background:#fff;padding:18px 18px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e7ecef}.brand{font-size:23px;font-weight:800}.brand b{color:#16a66a}.sub{font-size:11px;letter-spacing:2px;color:#68757d;margin-top:3px}.page{padding:14px 14px 90px;max-width:720px;margin:auto}.card{background:#fff;border-radius:15px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #1d2a3310}.hero{display:flex;gap:14px;align-items:center}.caricon{width:74px;height:74px;border-radius:20px;background:linear-gradient(145deg,#eafaf2,#fff);display:grid;place-items:center;font-size:42px}.h1{font-size:20px;font-weight:800}.muted{color:#77848b;font-size:13px}.green{color:#12965d}.money{font-size:27px;font-weight:900;color:#11945b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafb;border-radius:12px;padding:12px}.stat strong{display:block;font-size:18px;margin-top:5px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700;background:#16a66a;color:white}.btn.gray{background:#eef2f4;color:#34434c}.btn.danger{background:#fff0f0;color:#c53131}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:7px;margin:10px 0}.tab{flex:1;border:1px solid #dfe6e9;background:#fff;border-radius:9px;padding:9px}.tab.on{background:#e8f8f1;border-color:#8ed6b5;color:#087b4b;font-weight:800}input,select{width:100%;padding:11px;border:1px solid #dce4e8;border-radius:9px;background:#fff;font-size:14px}label{font-size:12px;color:#69767d;display:block;margin:9px 0 5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e7e9;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{border:0;background:none;padding:9px 2px 10px;color:#68757d;font-size:11px}.nav button.on{color:#07955a;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.item{padding:13px 0;border-bottom:1px solid #edf1f2}.item:last-child{border:0}.badge{padding:5px 8px;border-radius:20px;font-size:11px;background:#edf8f3;color:#0b8d57}.warn{background:#fff4e8;color:#c96b08}.dangertext{color:#d04444}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 5px;border-bottom:1px solid #edf0f2;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.bar{height:10px;background:#e9eff1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#19a66b;border-radius:10px}.notice{background:#eef7ff;border-left:4px solid #4c9fe8;padding:11px;border-radius:8px;font-size:12px;line-height:1.5}.small{font-size:11px}.hidden{display:none}.footer{text-align:center;color:#8b969b;font-size:11px;padding:20px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20}.modalbox{background:#fff;width:min(92%,420px);border-radius:16px;padding:20px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.success{color:#078e56;font-weight:700}.canvas{width:100%;height:220px;background:#fbfcfc;border-radius:10px}
</style></head><body><header><div class="brand">전기차 <b>차량 관리</b></div><div class="sub">EV CAR · CREATED BY SEUNG HYUN</div></header><main class="page" id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div>
<script>
const K='evcar_v8';let S=JSON.parse(localStorage.getItem(K)||'null')||{tab:'home',vehicle:{name:'차량 1',model:'BYD SEAL AWD',year:'2025',trim:'AWD',battery:82.5,odometer:35200},charges:[],maint:[{n:'공조장치용 에어필터(항균필터)',km:10000,mo:12,lastKm:33400,lastDate:'2026-02-10'},{n:'타이어 위치교환',km:10000,mo:12,lastKm:30000,lastDate:'2025-12-10'},{n:'감속기 오일',km:60000,mo:48,lastKm:0,lastDate:''},{n:'브레이크액',km:50000,mo:48,lastKm:0,lastDate:''},{n:'와이퍼',km:20000,mo:24,lastKm:25000,lastDate:'2025-08-01'}],warranty:[['일반 보증','5년 / 100,000 km'],['고전압 배터리','8년 / 160,000 km'],['구동 모터','8년 / 160,000 km'],['인버터/전력변환장치','8년 / 160,000 km'],['차량 주요 전장','5년 / 100,000 km'],['12V 보조 배터리','1년 / 20,000 km']],settings:{key:''},online:{kepco:null,cha:null,last:''}};
function save(){localStorage.setItem(K,JSON.stringify(S))}function money(n){return Math.round(n||0).toLocaleString('ko-KR')+'원'}function num(n){return Number(n||0).toLocaleString('ko-KR')}function daysFrom(d){if(!d)return 0;return Math.max(0,Math.floor((Date.now()-new Date(d))/86400000))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let a=document.getElementById('app');a.innerHTML=views[S.tab]();document.getElementById('nav').innerHTML=[['home','⌂','홈'],['charge','ϟ','충전요금'],['car','🚗','차량관리'],['warranty','♢','보증정보'],['settings','⚙','설정']].map(x=>`<button class="${S.tab==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');save()}function go(t){S.tab=t;render()}function totalCharge(){return S.charges.reduce((a,x)=>a+Number(x.fee||0),0)}
const views={
home:()=>`<div class="card hero"><div class="caricon">🚙</div><div><div class="h1">${esc(S.vehicle.model)}</div><div class="muted">${esc(S.vehicle.trim)} · ${S.vehicle.battery} kWh</div><div class="green" style="margin-top:6px;font-weight:800">총 주행거리 ${num(S.vehicle.odometer)} km</div></div></div><div class="grid"><div class="stat">이번 달 충전요금<strong>${money(totalCharge())}</strong></div><div class="stat">관리 예정<strong>${S.maint.filter(x=>due(x)).length}건</strong></div></div><div class="card"><div class="row"><b>최근 충전</b><button class="btn gray" onclick="go('charge')">전체보기</button></div>${S.charges.length?S.charges.slice(-3).reverse().map(x=>`<div class="item"><div class="row"><span>${esc(x.date)}</span><b>${money(x.fee)}</b></div><div class="muted">${num(x.kwh)} kWh · ${num(x.odometer)} km</div></div>`).join(''):'<div class="muted" style="padding:18px 0">충전 기록이 없습니다.</div>'}</div><div class="card"><div class="row"><b>다음 관리</b><span class="badge">km / 개월 자동 판단</span></div>${S.maint.slice(0,4).map(x=>`<div class="item"><div class="row"><span>${esc(x.n)}</span><span class="${due(x)?'badge warn':'badge'}">${due(x)?'교체 권장':'정상'}</span></div><div class="muted">${nextText(x)}</div></div>`).join('')}</div><div class="notice">온라인 데이터는 설정에서 공공데이터포털 인증키를 등록하면 한전 전기차 충전전력 단가/사용량 및 CHA-ON 공개 데이터를 갱신할 수 있습니다.</div><div class="footer">전기차 차량 관리 · EV CAR<br>CREATED BY Seung Hyun</div>`,
charge:()=>{let mode=window._cmode||'month';let rows=groupCharges(mode);return `<div class="card"><div class="row"><div><div class="h1">충전 요금</div><div class="muted">주행거리와 충전량을 함께 기록합니다.</div></div><button class="btn" onclick="chargeForm()">+ 충전 기록</button></div><div class="tabs">${['day','month','year'].map(m=>`<button class="tab ${mode==m?'on':''}" onclick="window._cmode='${m}';render()">${m=='day'?'일':m=='month'?'월':'년'}</button>`).join('')}</div>${rows.length?`<table class="table"><tr><th>기간</th><th>kWh</th><th>주행 km</th><th>요금</th></tr>${rows.map(r=>`<tr><td>${esc(r.key)}</td><td>${num(r.kwh)}</td><td>${num(r.km)}</td><td>${money(r.fee)}</td></tr>`).join('')}</table>`:'<div class="muted" style="padding:25px;text-align:center">충전 기록을 입력해 주세요.</div>'}</div><div class="card"><div class="row"><b>표 / 그래프</b><div><button class="btn gray" onclick="chart('table')">표</button> <button class="btn" onclick="chart('graph')">그래프</button></div></div><canvas id="chart" class="canvas"></canvas></div><div class="card"><b>한전 기준 데이터</b><div class="item"><div class="row"><span>온라인 상태</span><span class="${S.online.last?'success':'badge warn'}">${S.online.last?'연동됨':'인증키 필요'}</span></div><div class="muted">${S.online.last?'마지막 갱신: '+S.online.last:'설정 → 온라인 데이터에서 인증키 등록'}</div></div></div>`},
car:()=>`<div class="card"><div class="row"><div><div class="h1">차량관리</div><div class="muted">현재 주행거리 ${num(S.vehicle.odometer)} km</div></div><select style="width:120px" onchange="S.vehicle.odometer=Number(this.value);save();render()"><option>${S.vehicle.odometer}</option></select></div><div style="margin-top:10px"><label>현재 주행거리(km)</label><input id="odo" type="number" value="${S.vehicle.odometer}"><button class="btn" style="margin-top:8px" onclick="S.vehicle.odometer=Number(document.getElementById('odo').value);save();render()">주행거리 저장</button></div></div><div class="card">${S.maint.map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.n)}</b><span class="${due(x)?'badge warn':'badge'}">${due(x)?'교체 권장':'정상'}</span></div><div class="muted">주기 ${num(x.km)} km / ${num(x.mo)}개월 · ${nextText(x)}</div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn gray" onclick="editMaint(${i})">km/개월 변경</button><button class="btn gray" onclick="removeMaint(${i})">삭제</button></div></div>`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="addMaint()">＋ 항목 추가</button></div>`,
warranty:()=>`<div class="card"><div class="h1">보증정보</div><div class="muted">${esc(S.vehicle.model)} · ${S.vehicle.year}년식 · ${esc(S.vehicle.trim)}</div><div style="margin-top:10px"><label>차량 등록일</label><input id="reg" type="date" value="2025-02-10"><button class="btn" style="margin-top:8px" onclick="alert('보증 계산 기준일이 저장되었습니다.')">저장</button></div></div><div class="card">${S.warranty.map(w=>`<div class="item"><div class="row"><b>${esc(w[0])}</b><span class="badge">${esc(w[1])}</span></div><div class="muted">차량별 실제 보증은 제조사 보증서/약관을 최종 확인하세요.</div></div>`).join('')}</div><div class="notice">차종·트림을 선택하면 제조사 보증조건을 표시하는 구조입니다. 실제 제조사별 보증조건은 업데이트 데이터가 확보되는 경우 온라인 데이터로 갱신하도록 설계되어 있습니다.</div>`,
settings:()=>`<div class="card"><div class="h1">설정</div><label>차량명</label><input id="vmodel" value="${esc(S.vehicle.model)}"><label>트림</label><input id="vtrim" value="${esc(S.vehicle.trim)}"><label>배터리 용량(kWh)</label><input id="vbatt" type="number" value="${S.vehicle.battery}"><button class="btn" style="margin-top:10px" onclick="S.vehicle.model=document.getElementById('vmodel').value;S.vehicle.trim=document.getElementById('vtrim').value;S.vehicle.battery=Number(document.getElementById('vbatt').value);save();render()">차량정보 저장</button></div><div class="card"><div class="h1">온라인 데이터</div><div class="notice">공공데이터포털 API는 인증키가 필요합니다. 인증키는 앱에만 저장되며 공개 저장소에 넣지 마세요.</div><label>공공데이터포털 인증키</label><input id="apikey" type="password" value="${esc(S.settings.key)}" placeholder="서비스키 입력"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="setKey()">키 저장</button><button class="btn gray" onclick="online('kepco')">한전 데이터 갱신</button><button class="btn gray" onclick="online('cha')">CHA-ON 갱신</button></div><div class="item"><b>연동 출처</b><div class="muted">한국전력공사 전기차 충전전력 월별 계시별 사용량/판매단가 · 한전KDN CHA-ON 충전요금/충전량</div></div><div id="onlineStatus" class="small"></div></div><div class="card"><div class="h1">데이터 초기화</div><div class="muted">부분 또는 전체를 초기화할 수 있습니다. 초기화 후 복구할 수 없습니다.</div><div class="grid" style="margin-top:10px"><button class="btn danger" onclick="resetPart('charge')">충전 정보</button><button class="btn danger" onclick="resetPart('maint')">차량관리</button><button class="btn danger" onclick="resetPart('month')">월간 데이터</button><button class="btn danger" onclick="resetPart('year')">연간 데이터</button></div><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetAll()">전체 초기화</button></div>`};
function due(x){let km=S.vehicle.odometer-(x.lastKm||0);let mo=Math.floor(daysFrom(x.lastDate)/30.44);return (x.km&&km>=x.km)||(x.mo&&mo>=x.mo)}function nextText(x){let nk=Math.max(0,(x.lastKm||0)+Number(x.km||0)-S.vehicle.odometer);let nm=Math.max(0,Number(x.mo||0)-Math.floor(daysFrom(x.lastDate)/30.44));return `다음 교체: ${num(nk)} km 후 / ${num(nm)}개월 후`}function groupCharges(mode){let m={};S.charges.forEach(x=>{let d=new Date(x.date);let k=mode=='day'?x.date:mode=='month'?d.toISOString().slice(0,7):String(d.getFullYear());m[k]??={key:k,kwh:0,km:0,fee:0};m[k].kwh+=Number(x.kwh);m[k].km+=Number(x.km||0);m[k].fee+=Number(x.fee||0)});return Object.values(m).sort((a,b)=>a.key.localeCompare(b.key)).reverse()}
function chargeForm(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="h1">충전 기록 추가</div><label>충전일</label><input id="cd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>충전량(kWh)</label><input id="ck" type="number" step="0.1"><label>주행거리(km)</label><input id="cm" type="number" value="${S.vehicle.odometer}"><label>충전요금(원)</label><input id="cf" type="number"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="saveCharge()">저장</button><button class="btn gray" onclick="closeM()">취소</button></div></div></div>`}function saveCharge(){S.charges.push({date:document.getElementById('cd').value,kwh:Number(document.getElementById('ck').value),km:Number(document.getElementById('cm').value),fee:Number(document.getElementById('cf').value)});save();closeM();render()}function closeM(){document.getElementById('modal').innerHTML=''}
function addMaint(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="h1">관리 항목 추가</div><label>항목명</label><input id="mn"><label>주기(km)</label><input id="mk" type="number"><label>주기(개월)</label><input id="mm" type="number"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="saveMaint()">추가</button><button class="btn gray" onclick="closeM()">취소</button></div></div></div>`}function saveMaint(){S.maint.push({n:document.getElementById('mn').value,km:Number(document.getElementById('mk').value),mo:Number(document.getElementById('mm').value),lastKm:S.vehicle.odometer,lastDate:new Date().toISOString().slice(0,10)});save();closeM();render()}function editMaint(i){let x=S.maint[i];document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="h1">${esc(x.n)}</div><label>주기(km)</label><input id="ek" type="number" value="${x.km}"><label>주기(개월)</label><input id="em" type="number" value="${x.mo}"><label>최근 교체 주행거리</label><input id="el" type="number" value="${x.lastKm||0}"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="S.maint[${i}].km=Number(ek.value);S.maint[${i}].mo=Number(em.value);S.maint[${i}].lastKm=Number(el.value);save();closeM();render()">저장</button><button class="btn gray" onclick="closeM()">취소</button></div></div></div>`}function removeMaint(i){if(confirm('정말로 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.')){S.maint.splice(i,1);save();render()}}
function setKey(){S.settings.key=document.getElementById('apikey').value.trim();save();alert('인증키를 저장했습니다.');render()}function online(type){let k=S.settings.key;if(!k){alert('먼저 공공데이터포털 인증키를 입력하세요.');return}document.getElementById('onlineStatus').innerHTML='데이터를 불러오는 중…';Android.fetchOnline(k,type)}window.onOnlineData=function(type,wrapped){try{let r=JSON.parse(wrapped);if(!r.ok)throw new Error(r.error);let d=JSON.parse(r.data);S.online[type]=d;S.online.last=new Date().toLocaleString('ko-KR');save();document.getElementById('onlineStatus').innerHTML='<span class="success">온라인 데이터 갱신 완료</span> · '+S.online.last}catch(e){document.getElementById('onlineStatus').innerHTML='<span class="dangertext">갱신 실패: '+esc(e.message)+'</span>'}}
function resetPart(t){if(!confirm('정말로 초기화하시겠습니까? 초기화 후 복구할 수 없습니다.'))return;if(t=='charge')S.charges=[];else if(t=='maint')S.maint=[];else if(t=='month')S.charges=S.charges.filter(x=>new Date(x.date).getFullYear()!=new Date().getFullYear()||new Date(x.date).getMonth()!=new Date().getMonth());else if(t=='year')S.charges=S.charges.filter(x=>new Date(x.date).getFullYear()!=new Date().getFullYear());save();render()}function resetAll(){if(confirm('정말로 초기화하시겠습니까? 초기화 후 복구할 수 없습니다.')){localStorage.removeItem(K);location.reload()}}
function chart(type){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d'),r=groupCharges('month').slice(0,8).reverse();ctx.clearRect(0,0,c.width=c.clientWidth*2,c.height=c.clientHeight*2);ctx.scale(2,2);let w=c.clientWidth,h=c.clientHeight; if(!r.length){ctx.fillText('충전 기록을 추가하면 그래프가 표시됩니다.',20,40);return}let max=Math.max(...r.map(x=>x.fee),1),bw=(w-40)/r.length*.65;r.forEach((x,i)=>{let bh=(x.fee/max)*(h-45);ctx.fillStyle='#19a66b';ctx.fillRect(25+i*((w-40)/r.length),h-25-bh,bw,bh);ctx.fillStyle='#536168';ctx.font='10px sans-serif';ctx.fillText(x.key.slice(5),25+i*((w-40)/r.length),h-10);ctx.fillText(Math.round(x.fee/1000)+'k',25+i*((w-40)/r.length),h-30-bh)})}
render();window.addEventListener('resize',()=>{if(S.tab=='charge')chart('graph')});
</script></body></html>
